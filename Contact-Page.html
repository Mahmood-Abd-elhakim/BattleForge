                <div class="name">
                    <i class="fa-solid fa-id-badge" style="color: rgb(199, 30, 36);"></i>
                    <label>Name</label>
                    <input type="text" required placeholder="" name="name" minlength="5" maxlength="20" />
                </div>
                
                <div class="email">
                    <i class="fa-regular fa-envelope"></i>
                    <label>Email or mobile</label>
                    <input type="text" required placeholder="" name="mail" />
                </div>
                
                <div class="subject">
                    <i class="fa-regular fa-pen-to-square"> </i> 
                    <label>Subject</label>
                    <input id="subject" type="text" name="subject" required placeholder="" />
                </div>
              
                <div class="message">
                    <i class="fa-solid fa-message" style="color: rgb(199, 30, 36);"></i>
                    <label>Enter Ur Message</label>
                    <textarea name="message" placeholder=""></textarea>
                </div>
               
                <div class="rs-sub">
                    <div class="reset">
                        <input type="reset" />
                    </div>
                    <div class="Send">
                        <input type="submit" value="Send" />
                    </div>
                </div>
            </div>
        </form>
